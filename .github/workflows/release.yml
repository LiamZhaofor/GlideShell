# 推 v* tag：核对版本号 → 测试 → NativeAOT 打包 → 建「草稿」Release 并附上发布包。
# 草稿不会被升级检测看到（/releases/latest 不含草稿）；核对说明后在 GitHub 上点发布，用户才会收到通知。
# 说明取 docs/release-notes/<版本>.md，没有就留一段占位文字，发布前补上。
# 手动运行（workflow_dispatch）= 试跑：只测试和打包，发布包存为构建产物，不建 Release。
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 核对版本号
        id: version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("${{ github.ref_type }}" -eq "tag" -and "v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 与 Directory.Build.props 的版本 $version 不一致" }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: 测试
        run: dotnet test GlideShell.slnx -c Release

      - name: 打包（NativeAOT）
        shell: pwsh
        run: pwsh build/package.ps1 -Aot

      - name: 保存发布包（试跑）
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: GlideShell-${{ steps.version.outputs.version }}-win-x64
          path: artifacts/GlideShell-${{ steps.version.outputs.version }}-win-x64.zip

      - name: 建草稿 Release
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $zip = "artifacts/GlideShell-$version-win-x64.zip"
          $notes = "docs/release-notes/$version.md"
          if (-not (Test-Path $notes)) {
            $notes = Join-Path $env:RUNNER_TEMP "notes.md"
            "（发布前在这里写更新说明。）`n`n## 安装`n`n下载 ``GlideShell-$version-win-x64.zip``，解压后双击 Install.cmd（无需管理员）。" |
              Set-Content -Encoding utf8 $notes
          }
          gh release create "${{ github.ref_name }}" $zip --draft --title "GlideShell $version" --notes-file $notes --verify-tag
          (Get-FileHash $zip -Algorithm SHA256).Hash
